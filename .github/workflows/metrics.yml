# Guardar como .github/workflows/metrics.yml en el repo Jairandres05/Jairandres05
# Genera github-metrics.svg en tu propio repositorio (sin depender de servidores externos).
# Requiere un secreto llamado METRICS_TOKEN (ver instrucciones).
name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"     # una vez al día
  workflow_dispatch:         # permite ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Jairandres05
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Santiago

          # Lenguajes más usados
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          # Calendario de contribuciones + racha
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
